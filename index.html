<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Chamados — TI SEDEL</title>
  <link rel="icon" type="image/jpeg" href="sedel.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #143d73;
      --primary-hover: #0f2f59;
      --bg-page: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 8px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 640px;
      height: min(720px, calc(100vh - 40px));
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-header {
      padding: 14px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      border-top: 3px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
      border-radius: 4px;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: #94a3b8;
    }

    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg-subtle);
    }

    .chat-feed::-webkit-scrollbar {
      width: 6px;
    }

    .chat-feed::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 3px;
    }

    .message-row {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }

    .message-row.bot {
      align-self: flex-start;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    .message-row.bot .avatar {
      background: var(--primary);
      color: #ffffff;
    }

    .message-row.user .avatar {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .bubble {
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: var(--radius);
    }

    .message-row.bot .bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .message-row.user .bubble {
      background: var(--primary);
      color: #ffffff;
    }

    .bubble code {
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--primary);
    }

    .bubble a {
      color: var(--primary);
      text-decoration: underline;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .tag-n1 { background: #dcfce7; color: #166534; }
    .tag-n2 { background: #fef3c7; color: #92400e; }
    .tag-n3 { background: #fee2e2; color: #991b1b; }

    .ticket-receipt {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ticket-receipt .label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .ticket-receipt .protocol {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 2px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .quick-actions {
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
    }

    .quick-actions:empty {
      display: none;
    }

    .action-btn {
      padding: 7px 14px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      background: var(--bg-surface);
      color: var(--primary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .action-btn:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .composer {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
    }

    .composer textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13.5px;
      font-family: inherit;
      max-height: 110px;
      outline: none;
      color: var(--text-main);
      background: var(--bg-surface);
      line-height: 1.45;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .composer textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 61, 115, 0.1);
    }

    .btn-send {
      height: 38px;
      padding: 0 14px;
      background: var(--primary);
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s;
    }

    .btn-send:hover {
      background: var(--primary-hover);
    }

    .btn-send:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .app-footer {
      padding: 8px 20px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <img src="sedel.jpg" alt="SEDEL" class="brand-logo" />
      <div class="brand-text">
        <h1>Central de Atendimento de TI</h1>
        <span>Triagem e abertura de chamados</span>
      </div>
    </div>
    <button type="button" class="btn-secondary" id="btnReset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      Novo chamado
    </button>
  </header>

  <main class="chat-feed" id="chatFeed"></main>
  <div class="quick-actions" id="quickActions"></div>

  <form class="composer" id="chatForm">
    <textarea
      id="messageInput"
      placeholder="Descreva sua solicitação..."
      rows="1"
      autocomplete="off"
    ></textarea>
    <button type="submit" class="btn-send" id="btnSend">
      Enviar
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13" />
        <polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    </button>
  </form>

  <footer class="app-footer">
    <span>SEDEL — Secretaria de Estado do Desporto e Lazer</span>
    <span>Suporte Interno</span>
  </footer>
</div>

<script>
  const ENDPOINTS = {
    chat: '/api/chat',
    reset: '/api/reset'
  };

  const els = {
    feed: document.getElementById('chatFeed'),
    actions: document.getElementById('quickActions'),
    form: document.getElementById('chatForm'),
    input: document.getElementById('messageInput'),
    sendBtn: document.getElementById('btnSend'),
    resetBtn: document.getElementById('btnReset')
  };

  let isSending = false;
  let sessionId = sessionStorage.getItem('sedel_session');

  if (!sessionId) {
    sessionId = 'sess_' + Math.random().toString(36).slice(2, 11);
    sessionStorage.setItem('sedel_session', sessionId);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatBotText(text) {
    return escapeHtml(text)
      .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
      .replace(/`(.*?)`/g, '<code>$1</code>')
      .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function scrollToBottom() {
    els.feed.scrollTop = els.feed.scrollHeight;
  }

  function appendMessage(role, content, level) {
    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'bot' ? 'TI' : 'EU';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'bot') {
      bubble.innerHTML = content;
      if (level) {
        const tag = document.createElement('span');
        tag.className = `tag tag-${level.toLowerCase()}`;
        tag.textContent = level;
        bubble.appendChild(tag);
      }
    } else {
      bubble.textContent = content;
    }

    row.append(avatar, bubble);
    els.feed.appendChild(row);
    scrollToBottom();
  }

  function appendReceipt(protocol) {
    const card = document.createElement('div');
    card.className = 'ticket-receipt';
    card.innerHTML = `
      <span class="label">Protocolo gerado</span>
      <span class="protocol">${escapeHtml(protocol)}</span>
    `;
    els.feed.appendChild(card);
    scrollToBottom();
  }

  function renderActions(options) {
    els.actions.innerHTML = '';
    options.forEach((label) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'action-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => dispatchMessage(label));
      els.actions.appendChild(btn);
    });
  }

  function setTyping(visible) {
    const existing = document.getElementById('typingIndicator');
    if (!visible) {
      if (existing) existing.remove();
      return;
    }

    const row = document.createElement('div');
    row.className = 'message-row bot';
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="avatar">TI</div>
      <div class="bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    `;
    els.feed.appendChild(row);
    scrollToBottom();
  }

  async function postChat(mensagem) {
    try {
      const response = await fetch(ENDPOINTS.chat, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagem, sessionId })
      });
      return await response.json();
    } catch {
      return {
        resposta: 'Não foi possível conectar ao servidor de atendimento. Verifique se o serviço está ativo.',
        opcoes: []
      };
    }
  }

  function handleBotResponse(data) {
    if (!data) return;
    appendMessage('bot', formatBotText(data.resposta), data.tipoChamado);

    if (data.numeroChamado) {
      appendReceipt(data.numeroChamado);
    }

    if (Array.isArray(data.opcoes) && data.opcoes.length > 0) {
      renderActions(data.opcoes);
    }
  }

  async function dispatchMessage(text) {
    if (!text || isSending) return;
    isSending = true;
    els.sendBtn.disabled = true;
    els.actions.innerHTML = '';

    appendMessage('user', text);
    setTyping(true);

    const data = await postChat(text);
    setTyping(false);

    isSending = false;
    els.sendBtn.disabled = false;

    handleBotResponse(data);
    els.input.focus();
  }

  async function startSession() {
    els.feed.innerHTML = '';
    els.actions.innerHTML = '';
    const data = await postChat('');
    handleBotResponse(data);
  }

  async function resetSession() {
    await fetch(ENDPOINTS.reset, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId })
    }).catch(() => {});
    startSession();
  }

  els.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) return;
    els.input.value = '';
    els.input.style.height = 'auto';
    dispatchMessage(text);
  });

  els.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      els.form.requestSubmit();
    }
  });

  els.input.addEventListener('input', () => {
    els.input.style.height = 'auto';
    els.input.style.height = `${Math.min(els.input.scrollHeight, 110)}px`;
  });

  els.resetBtn.addEventListener('click', resetSession);

  window.addEventListener('DOMContentLoaded', startSession);
</script>
</body>
</html>
