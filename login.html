<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Administrativo — TI SEDEL</title>
  <link rel="icon" type="image/jpeg" href="sedel.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #143d73;
      --primary-hover: #0f2f59;
      --bg-page: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --radius: 8px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    .auth-header {
      padding: 28px 28px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .auth-header img {
      height: 44px;
      width: auto;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    .auth-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .auth-header p {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .auth-body {
      padding: 24px 28px 28px;
    }

    .alert-error {
      display: none;
      padding: 10px 12px;
      margin-bottom: 18px;
      font-size: 12.5px;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      line-height: 1.4;
    }

    .alert-error.visible {
      display: block;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .field input {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 61, 115, 0.1);
    }

    .btn-submit {
      width: 100%;
      height: 40px;
      margin-top: 6px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .auth-footer {
      padding: 14px 28px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="auth-card">
    <div class="auth-header">
      <img src="sedel.jpg" alt="SEDEL" />
      <h1>Acesso Administrativo</h1>
      <p>Central de Atendimento de TI — SEDEL</p>
    </div>

    <div class="auth-body">
      <div class="alert-error" id="errorBox" role="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail institucional</label>
          <input
            type="email"
            id="email"
            placeholder="admin@sedel.am.gov.br"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Entrar</button>
      </form>
    </div>

    <div class="auth-footer">
      <span>Suporte Interno</span>
      <a href="index.html">Voltar ao atendimento</a>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const errorBox = document.getElementById('errorBox');
    const btnSubmit = document.getElementById('btnSubmit');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    emailInput.addEventListener('input', clearError);
    senhaInput.addEventListener('input', clearError);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = emailInput.value.trim();
      const senha = senhaInput.value;

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Entrando...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await response.json();

        if (response.ok && data.sucesso) {
          localStorage.setItem('sedel_token', 'autenticado');
          window.location.href = 'adms.html';
          return;
        }

        showError(data.erro || 'E-mail ou senha incorretos.');
      } catch {
        showError('Não foi possível conectar ao servidor. Verifique se o backend está ativo.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
